name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**", "comconnect/**"]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          find microservices services routes controllers -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate gateway
        working-directory: gateway
        run: |
          npm install
          npm run build

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_API_URL: http://localhost:5000
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Test AI service
        working-directory: ai-service
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Validate Docker Compose
        run: docker compose config --quiet

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format and validate AWS infrastructure
        working-directory: infra/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
